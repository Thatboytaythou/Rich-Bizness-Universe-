name: Rich Bizness Repair Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [rb-staged-repair-20260823]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://xfsrqomsiulswbalgknx.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_pW8c7eWAX1GPi5HbncKjpg_CicEceV8
      LIVEKIT_URL: wss://rich-bizness-mobile-app-ww6cieid.livekit.cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Validate contracts
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Canonical source ownership gate
        run: node scripts/validate-repair-stage.mjs
