name: Rich Bizness browser release smoke
on:
  push:
    branches: [release/v1-foundation]
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact Rich Bizness Vercel preview URL
        required: true
        type: string
      authenticated:
        description: Run read-only authenticated checks with a dedicated test identity
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  deployments: read
jobs:
  portal-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install isolated browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/rb-component" --ignore-scripts --no-audit --no-fund playwright@1.55.1 typescript@5.9.2 three@0.179.1 sharp@0.34.5
          "$RUNNER_TEMP/rb-component/node_modules/.bin/playwright" install --with-deps chromium
      - name: Generate original responsive scene
        env:
          RB_BROWSER_PREFIX: ${{ runner.temp }}/rb-component
        run: node scripts/build-universe-art.mjs
      - name: Render actual Portal source in Chromium (no secrets)
        env:
          RB_BROWSER_PREFIX: ${{ runner.temp }}/rb-component
        run: node scripts/browser-portal-component.mjs
      - name: Render cinematic Profile with isolated owner and visitor fixtures
        env:
          RB_BROWSER_PREFIX: ${{ runner.temp }}/rb-component
        run: node scripts/browser-profile-component.mjs
      - name: Render original meshes and game paint helpers in WebGL and Canvas
        env:
          RB_BROWSER_PREFIX: ${{ runner.temp }}/rb-component
        run: node scripts/browser-original-assets.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install application and isolated browser runner
        run: |
          npm install --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/rb-browser" --ignore-scripts --no-audit --no-fund playwright@1.55.1
          "$RUNNER_TEMP/rb-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build exact checked-out commit using nonfunctional public fixture configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://rb-browser-fixture.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_fixture_not_a_real_key
          LIVEKIT_URL: wss://rb-browser-fixture.invalid
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: npm run build
      - name: Execute actual compiled mobile Chromium smoke without paid protection
        env:
          RB_BROWSER_PREFIX: ${{ runner.temp }}/rb-browser
          RB_BROWSER_URL: http://127.0.0.1:4173
          RB_EXPECTED_COMMIT: ${{ github.sha }}
          RB_LOCAL_BUILD: '1'
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory apps/web/dist > "$RUNNER_TEMP/rb-http.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/rb-section-release.json >/dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-release-smoke.mjs
  hosted-browser:
    if: github.event_name == 'workflow_dispatch'
    needs: browser
    environment: browser-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/rb-browser" --ignore-scripts --no-audit --no-fund playwright@1.55.1
          "$RUNNER_TEMP/rb-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Resolve matching Vercel deployment
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_URL: ${{ inputs.candidate }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA;
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          async function read(path){const r=await fetch('https://api.github.com/repos/'+repo+path,{headers});if(!r.ok)throw Error('GitHub deployment API '+r.status);return r.json();}
          const allowed=value=>{try{const u=new URL(value);return u.protocol==='https:'&&/^rich-bizness-[a-z0-9]+-rich-bizness-llc\.vercel\.app$/.test(u.hostname)?u.origin:null;}catch{return null;}};
          let url=allowed(process.env.MANUAL_URL);
          for(let attempt=0;!url&&attempt<35;attempt++){
            const deployments=await read('/deployments?sha='+sha+'&per_page=20');
            for(const d of deployments){if(d.sha!==sha)continue;const statuses=await read('/deployments/'+d.id+'/statuses?per_page=10');const success=statuses.find(s=>s.state==='success');url=allowed(success?.environment_url)||allowed(success?.target_url);if(url)break;}
            if(!url)await new Promise(r=>setTimeout(r,10000));
          }
          if(!url)throw Error('Exact Vercel deployment URL unavailable; run with the candidate URL.');
          appendFileSync(process.env.GITHUB_ENV,'RB_BROWSER_URL='+url+'\nRB_EXPECTED_COMMIT='+sha+'\n');
          JS
      - name: Execute actual mobile Chromium smoke
        env:
          RB_BROWSER_PREFIX: ${{ runner.temp }}/rb-browser
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/browser-release-smoke.mjs
  authenticated-browser:
    if: github.event_name == 'workflow_dispatch' && inputs.authenticated
    needs: hosted-browser
    environment: browser-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/rb-browser" --ignore-scripts --no-audit --no-fund playwright@1.55.1
          "$RUNNER_TEMP/rb-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Read-only authenticated browser verification
        env:
          RB_BROWSER_PREFIX: ${{ runner.temp }}/rb-browser
          RB_BROWSER_URL: ${{ inputs.candidate }}
          RB_EXPECTED_COMMIT: ${{ github.sha }}
          RB_REQUIRE_AUTH: '1'
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          RB_BROWSER_EMAIL: ${{ secrets.RB_BROWSER_EMAIL }}
          RB_BROWSER_PASSWORD: ${{ secrets.RB_BROWSER_PASSWORD }}
        run: node scripts/browser-release-smoke.mjs
